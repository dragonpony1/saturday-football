<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1D428A">
<title>Mess With 'Em All</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mess With 'Em All">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand">
    <h1>Mess With 'Em All</h1>
    <span class="who"><button id="who" hidden title="Switch league"></button> <button id="signout" hidden>Sign out</button>
      <button id="share" class="sharebtn" aria-label="Share the league invite">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Share</button></span>
  </div>
  <nav class="tabs" aria-label="Section">
    <button data-view="schedule" aria-pressed="true">Schedule</button>
    <button data-view="picks" aria-pressed="false">My picks</button>
    <button data-view="standings" aria-pressed="false">League</button>
    <button data-view="rules" aria-pressed="false">Rules</button>
  </nav>
  <nav class="weeks" id="weeks" aria-label="Week"></nav>
</header>
<button id="ticker" class="ticker" hidden aria-label="Latest league chat message"><span id="tickertext"></span></button>
<button id="scoreticker" class="ticker scoreticker" hidden aria-label="Live scores"><span id="scoretext"></span></button>
<main>
  <div class="topline"><span id="range"></span><span class="tz" id="tz"></span></div>
  <div id="updatebar" class="banner updatebar" role="status"></div>
  <div id="banner" class="banner" role="status"></div>
  <div id="content"></div>
</main>
<div id="gamemodal" class="modal" hidden>
  <div class="modalcard gamecard">
    <div id="gamedetail"></div>
    <button id="closegame" class="linkbtn">Close</button>
  </div>
</div>
<div id="sharemodal" class="modal" hidden>
  <div class="modalcard">
    <h2 id="modaltitle">Invite the family</h2>
    <img src="qr.png" alt="QR code that opens the league" class="qr">
    <p class="hint">Scan it with a phone camera, or send it by text.</p>
    <p class="code">Passcode: <b id="modalcode"></b></p>
    <button id="sendinvite">Send invite</button>
    <button id="a2hs" class="linkbtn">📲 Put this app on your home screen</button>
    <p id="a2hssteps" class="hint" hidden></p>
    <button id="closemodal" class="linkbtn">Close</button>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
